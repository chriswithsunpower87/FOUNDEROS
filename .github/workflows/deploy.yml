##
# FounderOS — Continuous Deployment
# Auto-deploys on push to main after CI passes.
#
# Jobs:
#   deploy-backend   — Deploys FastAPI to Render via deploy hook
#   deploy-frontend  — Deploys Next.js to Vercel via Vercel CLI
#
# Required GitHub Secrets:
#   RENDER_DEPLOY_HOOK_URL  — from Render dashboard → your service → Deploy Hook
#   VERCEL_TOKEN            — from vercel.com → Settings → Tokens
#   VERCEL_ORG_ID           — from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID       — from .vercel/project.json after `vercel link`
##

name: Deploy

on:
  push:
    branches: [main]

# Only deploy if CI passes
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:

  # ── Deploy Backend to Render ─────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: []   # Render auto-runs migrations via its Start Command

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
