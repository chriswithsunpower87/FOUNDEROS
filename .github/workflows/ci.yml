##
# FounderOS — Continuous Integration
# Runs on every pull request targeting main.
#
# Jobs:
#   backend-test  — Runs pytest with coverage report
#   frontend-lint — Runs TypeScript type-check + ESLint
##

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: Pytest ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          # Minimal env vars needed by the app's settings validation
          SECRET_KEY: "ci-test-secret-key-not-real"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SYNC_DATABASE_URL: "sqlite:///:memory:"
          GEMINI_API_KEY: "fake-key-for-ci"
          OPENROUTER_API_KEY: "fake-key-for-ci"
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=50

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: backend

  # ── Frontend: TypeScript + ESLint ───────────────────────────────────────────
  frontend-lint:
    name: Frontend Type Check + Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
