##
# FounderOS — docker-compose.yml
# Spins up the entire stack with a single command: docker-compose up
#
# Services:
#   postgres  — PostgreSQL 15 database
#   backend   — FastAPI + LangGraph AI pipeline
#   frontend  — Next.js 15
#
# Usage:
#   1. Copy backend/.env.example to backend/.env and fill in your API keys
#   2. docker-compose up --build
#   3. Open http://localhost:3000
#   4. Run migrations:  docker-compose exec backend alembic upgrade head
##

version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: founderos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: founderos
      POSTGRES_USER: founderos
      POSTGRES_PASSWORD: founderos_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderos -d founderos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: founderos_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override DB URLs to use the Docker service name instead of localhost
      DATABASE_URL: postgresql+asyncpg://founderos:founderos_secret@postgres:5432/founderos
      SYNC_DATABASE_URL: postgresql+psycopg2://founderos:founderos_secret@postgres:5432/founderos
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persist ChromaDB vector store across container restarts
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: founderos_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
